server:
  port: 8092

spring:
  application:
    name: nim-battle

  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: somePassword

  jpa:
    hibernate:
      ddl-auto: validate
      show-sql: true
      properties:
        hibernate:
          dialect: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    change-log: classpath:/db/changelog/dbchangelog.xml
    default-schema: nim_battle

  redis:
    host: localhost
    port: 6379
    timeout: 60
    time-to-live: 60
    password: