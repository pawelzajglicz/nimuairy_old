server:
  port: 8088
  servlet:
    context-path: "/social-network"

spring:
  application:
    name: nim-social-network

  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: somePassword

  jpa:
    hibernate:
      ddl-auto: validate
      show-sql: true
      properties:
        hibernate:
          dialect: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    change-log: classpath:/db/changelog/dbchangelog.xml
    default-schema: nim_social_network