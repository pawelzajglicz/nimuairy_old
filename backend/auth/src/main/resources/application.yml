jwt:
  expirationMs: 604800000
  refreshExpirationMs: 604800000
  secret: nimuairySecretKey

server:
  port: 8089

spring:
  application:
    name: nim-auth

  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: somePassword

  jpa:
    hibernate:
      ddl-auto: validate
      show-sql: true
      properties:
        hibernate:
          dialect: org.hibernate.dialect.PostgreSQLDialect

